<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>아콘과 대화하기 완료</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;800;900&family=Noto+Serif+KR:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
    <script>
      if (sessionStorage.getItem("quizFinished") !== "true") {
        location.replace("./intro.html");
      } else {
        sessionStorage.removeItem("quizFinished");
      }
    </script>
  </head>
  <body>
    <main class="screen-done" aria-label="아콘과 대화하기 완료">
      <div class="snack-layer" id="snackLayer" aria-label="선택한 간식"></div>

      <div class="done-container">
        <header class="done-title-set">
          <p class="screen-kicker">아콘과 대화하기</p>
          <div class="module-ribbon module-ribbon-done" aria-label="지구를 지키는 식탁 약속">
            <span class="ribbon-star" aria-hidden="true">✦</span>
            <h1>지구를 지키는 식탁 약속</h1>
            <span class="ribbon-star" aria-hidden="true">✦</span>
          </div>
        </header>
        <div class="done-card-list" id="doneCards" aria-label="문제별 결과"></div>
      </div>
    </main>

    <script type="module" src="./done.js"></script>
  </body>
</html>
